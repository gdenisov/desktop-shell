<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160" role="img" aria-label="A desktop: launcher icons on a light surface, one icon being dragged to an empty grid cell, a floating window with a chat list rail beside its page, and a dock along the bottom whose plus button sits at its left.">
  <title>Desktop Shell</title>

  <defs>
    <clipPath id="card">
      <rect x="0" y="0" width="240" height="160" rx="12"/>
    </clipPath>
    <clipPath id="win">
      <rect x="82" y="46" width="146" height="76" rx="9"/>
    </clipPath>
    <radialGradient id="glow" cx="0.5" cy="1.12" r="0.78">
      <stop offset="0" stop-color="#f4f5f8"/>
      <stop offset="1" stop-color="#f4f5f8" stop-opacity="0"/>
    </radialGradient>
    <filter id="tile-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.9" flood-color="#10121b" flood-opacity="0.09"/>
    </filter>
    <filter id="lift-shadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#10121b" flood-opacity="0.18"/>
    </filter>
    <filter id="window-shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.6" flood-color="#10121b" flood-opacity="0.07"/>
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#10121b" flood-opacity="0.13"/>
    </filter>
  </defs>

  <g clip-path="url(#card)">

    <!-- the desktop surface -->
    <rect x="0" y="0" width="240" height="160" fill="#fdfdfe"/>
    <rect x="0" y="0" width="240" height="160" fill="url(#glow)"/>

    <!-- launcher icons, flowing along the top row -->
    <g filter="url(#tile-shadow)">
      <rect x="14" y="14" width="20" height="20" rx="6" fill="#23262b"/>
      <rect x="44" y="14" width="20" height="20" rx="6" fill="#e7f4ec"/>
      <rect x="74" y="14" width="20" height="20" rx="6" fill="#fdf1dd"/>
      <rect x="104" y="14" width="20" height="20" rx="6" fill="#e7f0fd"/>
    </g>
    <g stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- make something: a plus -->
      <path d="M24 20.5 L24 27.5 M20.5 24 L27.5 24" stroke="#ffffff" stroke-width="1.7"/>
      <!-- chats: a bubble -->
      <path d="M49 20.5 h10 a1.6 1.6 0 0 1 1.6 1.6 v4.2 a1.6 1.6 0 0 1 -1.6 1.6 h-6.2 l-2.8 2.1 v-2.1 h-1 a1.6 1.6 0 0 1 -1.6 -1.6 v-4.2 a1.6 1.6 0 0 1 1.6 -1.6 z" stroke="#2f855a" stroke-width="1.3"/>
      <!-- files: a folder -->
      <path d="M79 27.8 v-6.2 h3.4 l1.3 1.6 h5.3 v4.6 a1.4 1.4 0 0 1 -1.4 1.4 h-7.2 a1.4 1.4 0 0 1 -1.4 -1.4 z" stroke="#d97706" stroke-width="1.3"/>
      <!-- terminal: a prompt -->
      <path d="M110.2 21.4 l3 2.6 l-3 2.6 M114.6 27 h4.2" stroke="#2563eb" stroke-width="1.4"/>
    </g>
    <g fill="#dcdce1">
      <rect x="17" y="37" width="14" height="2.6" rx="1.3"/>
      <rect x="47" y="37" width="14" height="2.6" rx="1.3"/>
      <rect x="77" y="37" width="14" height="2.6" rx="1.3"/>
      <rect x="107" y="37" width="14" height="2.6" rx="1.3"/>
    </g>

    <!-- an icon in the hand, and the grid cell it is heading for -->
    <rect x="47" y="90" width="26" height="34" rx="7" fill="none" stroke="#e0e0e6" stroke-width="1" stroke-dasharray="3 2.5"/>
    <g filter="url(#lift-shadow)">
      <rect x="15" y="93" width="22" height="22" rx="6.6" fill="#efeafd"/>
    </g>
    <path d="M21.5 99.5 h6.4 l2.6 2.6 v7.4 a1.4 1.4 0 0 1 -1.4 1.4 h-7.6 a1.4 1.4 0 0 1 -1.4 -1.4 v-8.6 a1.4 1.4 0 0 1 1.4 -1.4 z M24 104.6 h4 M24 107.4 h4" stroke="#6d47d9" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="18" y="119" width="16" height="2.6" rx="1.3" fill="#dcdce1"/>

    <!-- a floating window: the instance rail, then the page -->
    <g filter="url(#window-shadow)">
      <rect x="82" y="46" width="146" height="76" rx="9" fill="#ffffff"/>
    </g>
    <g clip-path="url(#win)">
      <!-- the chat list, down the left of the window -->
      <rect x="82" y="59" width="37" height="63" fill="#f3f2ef"/>
      <!-- new, at the head of the list -->
      <path d="M88.4 66 h5 M90.9 63.5 v5" stroke="#8d8d96" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <rect x="97" y="64.7" width="14" height="2.4" rx="1.2" fill="#c9c9d0"/>
      <!-- the selected row, in the active fill -->
      <rect x="84.5" y="72" width="32" height="10" rx="3" fill="#e7e5df"/>
      <circle cx="90.4" cy="77" r="2.4" fill="#2f855a"/>
      <rect x="96" y="75.8" width="17" height="2.4" rx="1.2" fill="#9a9aa2"/>
      <!-- the rest of the list, ordered by recency -->
      <circle cx="90.4" cy="89" r="2.4" fill="#d5d5db"/>
      <rect x="96" y="87.8" width="15" height="2.4" rx="1.2" fill="#d5d5db"/>
      <!-- a chat a background agent started, indented under the one that started it -->
      <circle cx="93.4" cy="99" r="2.4" fill="#d5d5db"/>
      <rect x="99" y="97.8" width="12" height="2.4" rx="1.2" fill="#d5d5db"/>
      <circle cx="90.4" cy="109" r="2.4" fill="#d5d5db"/>
      <rect x="96" y="107.8" width="16" height="2.4" rx="1.2" fill="#d5d5db"/>
      <line x1="119" y1="59" x2="119" y2="122" stroke="#e8e8ec" stroke-width="1"/>

      <!-- the page: a plain chat -->
      <rect x="181" y="66" width="41" height="10" rx="5" fill="#ededed"/>
      <g fill="#e2e2e7">
        <rect x="126" y="83" width="88" height="2.8" rx="1.4"/>
        <rect x="126" y="90" width="72" height="2.8" rx="1.4"/>
        <rect x="126" y="97" width="81" height="2.8" rx="1.4"/>
      </g>
      <rect x="126" y="106.5" width="96" height="10" rx="5" fill="#ffffff" stroke="#e8e8ec" stroke-width="1"/>

      <!-- the title bar -->
      <line x1="82" y1="59" x2="228" y2="59" stroke="#eeeef1" stroke-width="1"/>
      <rect x="89" y="49.5" width="6.5" height="6.5" rx="2" fill="#e7f4ec"/>
      <rect x="99.5" y="51.5" width="31" height="2.6" rx="1.3" fill="#d4d4da"/>
      <g stroke="#a1a1aa" stroke-width="1.1" stroke-linecap="round" fill="none">
        <path d="M201 55.2 h5"/>
        <rect x="210.5" y="50.7" width="4.6" height="4.6" rx="1.2"/>
        <path d="M219.4 50.8 l4.4 4.4 M223.8 50.8 l-4.4 4.4"/>
      </g>
    </g>
    <rect x="82.5" y="46.5" width="145" height="75" rx="8.5" fill="none" stroke="#10121b" stroke-opacity="0.07" stroke-width="1"/>

    <!-- the dock: what is running -->
    <rect x="0" y="136" width="240" height="24" fill="#ffffff" opacity="0.88"/>
    <line x1="0" y1="136" x2="240" y2="136" stroke="#e8e8ec" stroke-width="1"/>

    <!-- the plus: closed, it is a round outlined button -->
    <circle cx="17" cy="148" r="7.2" fill="none" stroke="#b7b7bf" stroke-width="1.2"/>
    <path d="M13.6 148 h6.8 M17 144.6 v6.8" stroke="#52525b" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <line x1="30" y1="142" x2="30" y2="154" stroke="#e8e8ec" stroke-width="1"/>

    <!-- tiles for what is on screen, and a smaller one for what has been put away -->
    <rect x="88" y="141" width="14" height="14" rx="4.5" fill="#e7f4ec"/>
    <rect x="106" y="141" width="14" height="14" rx="4.5" fill="#fdf1dd"/>
    <rect x="124" y="141" width="14" height="14" rx="4.5" fill="#e7f0fd"/>
    <rect x="142" y="143" width="10" height="10" rx="3.2" fill="#f1f2f5"/>
    <g stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M92 146.4 h6.4 a0.9 0.9 0 0 1 0.9 0.9 v2.4 a0.9 0.9 0 0 1 -0.9 0.9 h-4 l-1.8 1.3 v-1.3 h-0.6 a0.9 0.9 0 0 1 -0.9 -0.9 v-2.4 a0.9 0.9 0 0 1 0.9 -0.9 z" stroke="#2f855a" stroke-width="1.1"/>
      <path d="M109.6 150.6 v-4.4 h2.4 l0.9 1.1 h3.6 v3.3 z" stroke="#d97706" stroke-width="1.1"/>
      <path d="M128 145.8 l2.1 1.9 l-2.1 1.9 M131.2 149.6 h3" stroke="#2563eb" stroke-width="1.1"/>
      <path d="M145.2 148 h3.6 M145.2 150 h2.2" stroke="#9a9aa2" stroke-width="1"/>
    </g>

    <!-- the control that hides the dock -->
    <g stroke="#b7b7bf" stroke-width="1.1" stroke-linecap="round" fill="none">
      <path d="M219 148 q4.5 -4 9 0 q-4.5 4 -9 0 z"/>
      <circle cx="223.5" cy="148" r="1.3"/>
    </g>

    <!-- the card's own edge -->
    <rect x="0.5" y="0.5" width="239" height="159" rx="11.5" fill="none" stroke="#e4e3df" stroke-width="1"/>
  </g>
</svg>
